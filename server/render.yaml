services:
  - type: web
    name: sms-forwarder
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AUTH_TOKEN
        sync: false
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: WECOM_ENABLED
        value: "true"
      - key: WECOM_CORP_ID
        sync: false
      - key: WECOM_SECRET
        sync: false
      - key: WECOM_AGENT_ID
        sync: false
      - key: WECOM_WEBHOOK_URL
        sync: false
      - key: ALLOWED_SENDERS
        value: ""
